[build-system]
requires = ["setuptools >= 64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqtrade"
dynamic = ["version"]

authors = [
  {name = "Freqtrade Team"},
  {name = "Freqtrade Team", email = "freqtrade@protonmail.com"},
]

description = "Freqtrade - Crypto Trading Bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPLv3"}
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  # from requirements.txt
  "numpy==2.4.1",
  "pandas==2.3.3",
  "bottleneck==1.6.0",
  "numexpr==2.14.1",
  "ft-pandas-ta==0.3.16",
  "ta-lib==0.6.8",
  "technical==1.5.4",
  "ccxt",
  "cryptography==46.0.5",
  "aiohttp==3.13.3",
  "SQLAlchemy==2.0.45",
  "python-telegram-bot==22.5",
  "httpx>=0.24.1",
  "humanize==4.15.0",
  "cachetools==6.2.4",
  "requests==2.32.5",
  "urllib3==2.6.3",
  "certifi==2026.1.4",
  "jsonschema==4.26.0",
  "tabulate==0.9.0",
  "pycoingecko==3.2.0",
  "jinja2==3.1.6",
  "joblib==1.5.3",
  "rich==14.2.0",
  "pyarrow==23.0.0; platform_machine != 'armv7l'",
  "python-rapidjson==1.23",
  "orjson==3.11.5",
  "sdnotify==0.3.2",
  "fastapi==0.128.0",
  "pydantic==2.12.5",
  "uvicorn==0.40.0",
  "pyjwt==2.10.1",
  "aiofiles==25.1.0",
  "psutil==7.2.1",
  "questionary==2.1.1",
  "prompt-toolkit==3.0.52",
  "python-dateutil==2.9.0.post0",
  "pytz==2025.2",
  "schedule==1.2.2",
  "websockets==16.0",
  "janus==2.0.0",
  "ast-comments==1.2.3",
  "packaging==25.0",
  "freqtrade-client",
]

[project.optional-dependencies]
# Requirements used for submodules
plot = ["plotly>=4.0"]
hyperopt = [
  "scipy",
  "scikit-learn",
  "optuna > 4.0.0",
  "cmaes",
  "filelock",
]
freqai = [
  "scikit-learn",
  "joblib",
  "lightgbm",
  "xgboost",
  "tensorboard",
  "datasieve>=0.1.5",
]
freqai_rl = [
  "torch; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "gymnasium",
  "stable-baselines3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "sb3-contrib; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "tqdm",
]
develop = [
  "isort==7.0.0",
  "mypy==1.19.1",
  "pip-audit==2.10.0",
  "pre-commit==4.5.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "pytest-mock==3.15.1",
  "pytest-random-order==1.2.0",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "pytest==9.0.2",
  "ruff==0.15.0",
  "scipy-stubs==1.17.0.2",
  "time-machine==3.2.0",
  "types-cachetools==6.2.0.20251022",
  "types-filelock==3.2.7",
  "types-python-dateutil==2.9.0.20260124",
  "types-requests==2.32.4.20260107",
  "types-tabulate==0.9.0.20241207",
]
jupyter = [
  "jupyter",
  "nbstripout",
  "ipykernel",
  "nbconvert",
]
all = [
  "freqtrade[plot,hyperopt,freqai,freqai_rl,jupyter]",
]
dev = [
  "freqtrade[all,develop]",
]

[project.urls]
Homepage = "https://github.com/freqtrade/freqtrade"
Documentation = "https://freqtrade.io"
"Bug Tracker" = "https://github.com/freqtrade/freqtrade/issues"


[project.scripts]
freqtrade = "freqtrade.main:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["freqtrade*"]
exclude = ["tests", "tests.*", "user_data", "user_data*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "freqtrade.__version__"}

[tool.uv.sources]
ccxt = { path = "./ccxt/python", editable = true }

[tool.black]
line-length = 100
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  # Exclude vendor directory
  | vendor
)
'''

[tool.isort]
line_length = 100
profile = "black"
# multi_line_output=3
lines_after_imports=2
skip_glob = ["**/.env*", "**/env/*", "**/.venv/*", "**/docs/*", "**/user_data/*", "ccxt/**"]
known_first_party = ["freqtrade_client"]
known_third_party = ["ccxt"]

[tool.pytest.ini_options]
# TODO: should be migrated to [tool.pytest] as support for this was added in 9.0
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--dist loadscope"
norecursedirs = ["ccxt"]

[tool.mypy]
ignore_missing_imports = true
namespace_packages = false
warn_unused_ignores = true
exclude = [
    '^build_helpers\.py$',
    '^ft_client/build/.*$',
    '^ccxt/.*$',
]
plugins = [
  "sqlalchemy.ext.mypy.plugin"
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "freqtrade.templates.*",
  "tests.strategy.strats"
]
# Disable attr-defined check due to ta-lib not having type stubs
disable_error_code = "attr-defined"

[[tool.mypy.overrides]]
module = [
  "freqtrade.util.ft_precise",
  "freqtrade.exchange.*"
]
# Disable attr-defined and name-defined checks due to ccxt not having complete type stubs
disable_error_code = ["attr-defined", "name-defined"]

[tool.pyright]
include = ["freqtrade", "ft_client"]
exclude = [
  "**/__pycache__",
  "build_helpers/*.py",
  "ft_client/build/*",
  "build/*",
]
ignore = ["freqtrade/vendor/**"]
pythonPlatform = "All"
pythonVersion = "3.11"

typeCheckingMode = "off"
# analyzeUnannotatedFunctions = false

reportArgumentType = false  # 155
reportAssignmentType = false  # 12
reportAttributeAccessIssue = false  # 255
reportCallIssue = false  # 23
reportGeneralTypeIssues = false  # 48
reportIncompatibleMethodOverride = false  # 15
reportIncompatibleVariableOverride = false  # 5
reportIndexIssue = false  # 22
reportMissingImports = false  # 5
reportOperatorIssue = false  # 7
reportOptionalMemberAccess = false  # 35
reportOptionalOperand = false  # 7
reportPossiblyUnboundVariable = false  # 36
reportPrivateImportUsage = false  # 5
reportRedeclaration = false  # 1
reportReturnType = false  # 28
reportTypedDictNotRequiredAccess = false  # 27


[tool.ruff]
line-length = 100
extend-exclude = [".env", ".venv", "ccxt"]

[tool.ruff.lint]
extend-select = [
  "C90",    # mccabe
  "B",      # bugbear
  # "N",    # pep8-naming
  "F",      # pyflakes
  "E",      # pycodestyle
  "W",      # pycodestyle
  "UP",     # pyupgrade
  "I",      # isort
  "A",      # flake8-builtins
  "TID",    # flake8-tidy-imports
  # "EXE",  # flake8-executable
  # "C4",     # flake8-comprehensions
  "YTT",    # flake8-2020
  "S",      # flake8-bandit
  # "DTZ",  # flake8-datetimez
  # "RSE",  # flake8-raise
  # "TCH",  # flake8-type-checking
  "PTH",    # flake8-use-pathlib
  "RUF",    # ruff
  "ASYNC",  # flake8-async
  "NPY",    # numpy
]

extend-ignore = [
  "E241",  # Multiple spaces after comma
  "E272",  # Multiple spaces before keyword
  "E221",  # Multiple spaces before operator
  "B007",  # Loop control variable not used
  "B904",  # BugBear - except raise from
  "S603",  # `subprocess` call: check for execution of untrusted input
  "S607",  # Starting a process with a partial executable path
  "S608",  # Possible SQL injection vector through string-based query construction
  "NPY002",  # Numpy legacy random generator
  "RUF010",  # Use explicit conversion flag
  "RUF012",  # mutable-class-default
  "RUF022",  # unsorted-dunder-all
  "RUF005",  # list concatenation
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"freqtrade/freqai/**/*.py" = [
  "S311",  # Standard pseudo-random generators are not suitable for cryptographic purposes
]
"tests/**.py" = [
  "S101",  # allow assert in tests
  "S104",  #  Possible binding to all interfaces
  "S311",  # Standard pseudo-random generators are not suitable for cryptographic purposes
  "S105",  # Possible hardcoded password assigned to: "secret"
  "S106",  # Possible hardcoded password assigned to argument: "token_type"
  "S110",  # `try`-`except`-`pass` detected, consider logging the exception
  ]

"freqtrade/templates/**.py" = [
  "RUF100",  # Allow unused noqa
]

"ft_client/test_client/**.py" = [
  "S101",  # allow assert in tests
]

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["freqtrade_client"]
known-third-party = ["ccxt"]

[tool.flake8]
# Default from https://flake8.pycqa.org/en/latest/user/options.html#cmdoption-flake8-ignore
# minus E226
ignore = ["E121","E123","E126","E24", "E203","E704","W503","W504"]
max-line-length = 100
max-complexity = 12
exclude = [
    ".git",
    "__pycache__",
    ".eggs",
    "user_data",
    ".venv",
    ".env",
]
per-file-ignores = [
    "freqtrade/optimize/hyperopt/hyperopt_optimizer.py: F821",
]

[tool.codespell]
ignore-words-list = "coo,fo,strat,zar,selectin"
skip="*.svg,./user_data,freqtrade/rpc/api_server/ui/installed,freqtrade/exchange/*.json"
